<!DOCTYPE html>
<html>
<head>
<title>Anirudh Concert</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

<style>

/* BACKGROUND */
body {
    margin:0;
    font-family:'Poppins';
    color:white;

    background: url("{{ url_for('static', filename='anirudh.jpg') }}") no-repeat center center/cover;
    background-attachment: fixed;
}

/* DARK OVERLAY */
body::before {
    content:"";
    position:fixed;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
    top:0;
    left:0;
    z-index:-1;
}

/* HERO */
.hero {
    text-align:center;
    padding:60px;
}

.hero h1 {
    font-size:40px;
    letter-spacing:2px;
}

/* GLASS FORM */
.form-box {
    margin:20px auto;
    padding:30px;
    width:380px;

    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(18px);

    border-radius:20px;
    box-shadow:0 0 40px rgba(0,0,0,0.7);

    border:1px solid rgba(255,255,255,0.2);
}

/* INPUTS */
input, textarea {
    width:90%;
    padding:10px;
    margin:10px;
    border-radius:10px;
    border:none;
}

/* SEATS */
.seats button {
    margin:5px;
    padding:8px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#111;
    color:white;
    transition:0.3s;
}

.seats button:hover {
    background:#ff4b2b;
    transform:scale(1.1);
}

/* TICKETS */
.card {
    display:inline-block;
    padding:15px;
    margin:8px;
    border-radius:10px;
    cursor:pointer;
    transition:0.3s;
    font-weight:bold;
}

.card:hover {
    transform:scale(1.1);
}

.silver {background:#94a3b8;}
.gold {background:#f59e0b;}
.platinum {background:#a855f7;}
.vip {background:#ef4444;}

.selected {
    border:3px solid white;
}

/* BUTTON */
.submit-btn {
    margin-top:15px;
    padding:12px;
    width:90%;
    border:none;
    border-radius:10px;
    background:#ff4b2b;
    color:white;
    cursor:pointer;
    font-size:16px;
}

.submit-btn:hover {
    background:#ff1e00;
}

</style>
</head>

<body>

<div class="hero">
<h1>🎤 ANIRUDH LIVE</h1>
<p>Feel the music. Live the moment.</p>
</div>

<form action="/checkout" method="POST">
<div class="form-box">

<input name="name" placeholder="Full Name" required>
<input name="email" placeholder="Email">
<input name="phone" placeholder="Phone">
<textarea name="address" placeholder="Address"></textarea>

<h3>Select Seat</h3>
<div class="seats">
<button type="button" onclick="setSeat('A1')">A1</button>
<button type="button" onclick="setSeat('A2')">A2</button>
<button type="button" onclick="setSeat('B1')">B1</button>
<button type="button" onclick="setSeat('B2')">B2</button>
</div>

<input type="hidden" name="seat" id="seat">

<h3>Select Ticket</h3>

<div class="card silver" onclick="setTicket('Silver',3000,this)">Silver ₹3000</div>
<div class="card gold" onclick="setTicket('Gold',5000,this)">Gold ₹5000</div>
<div class="card platinum" onclick="setTicket('Platinum',8000,this)">Platinum ₹8000</div>
<div class="card vip" onclick="setTicket('VIP',12000,this)">VIP ₹12000</div>

<input type="hidden" name="ticket" id="ticket">
<input type="hidden" name="price" id="price">

<button class="submit-btn">Book Ticket</button>

</div>
</form>

<script>
function setSeat(s){
    document.getElementById("seat").value = s;
}

function setTicket(type,price,el){
    document.getElementById("ticket").value = type;
    document.getElementById("price").value = price;

    document.querySelectorAll('.card').forEach(c=>c.classList.remove('selected'));
    el.classList.add('selected');
}
</script>

</body>
</html>
